<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193a5b">
  <meta name="description" content="내 휴대폰에서 만난 직원과 전화한 사람의 직무 신분을 확인합니다.">
  <title>상대 확인 · 거꾸로 신분증</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data.js"></script>
  <script defer src="./protocol.browser.js"></script>
  <script defer src="./vendor/qrcode.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#app-content">본문으로 건너뛰기</a>
  <header class="demo-strip" aria-label="시연 장면 안내">
    <div class="strip-inner">
      <span class="demo-tag">시연</span><span id="scene-count">장면 1/9</span>
      <span class="strip-task" id="scene-task">시작하기를 눌러 보세요</span>
      <button id="guide-shortcut" class="strip-button shortcut" data-action="lock-preview" hidden>잠금까지 보기</button>
      <div class="strip-controls"><button id="previous" class="strip-button" aria-label="이전 장면">←</button><button id="next" class="strip-button">다음 →</button></div>
    </div>
  </header>
  <div class="workspace">
    <div class="workspace-label"><span class="wordmark">거꾸로 신분증<span class="wordmark-dot"></span></span><span>내가 확인하는, 상대의 신분</span></div>
    <div class="stage" id="stage">
      <div id="employee-desktop" class="employee-desktop"></div>
      <section class="phone" id="phone" aria-label="시민 모바일신분증">
        <div class="device-status" aria-hidden="true"><span id="clock">09:41</span><span class="device-island"></span><span class="signal">▮▮▮ <span class="battery"></span></span></div>
        <header class="appbar" id="appbar"></header>
        <main id="app-content" tabindex="-1"><div class="loading-view"><div class="skeleton"></div><div class="skeleton"></div><p>안전한 확인을 준비하고 있어요.</p></div></main>
        <nav class="tabbar" id="tabbar" aria-label="앱 메뉴"></nav>
      </section>
      <aside id="scene-panel" class="scene-panel" aria-label="장면 설명"></aside>
    </div>
    <footer class="disclaimer">시연용 모의 데이터 · 실제 모바일신분증·인사시스템과 연동하지 않음</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <noscript>상대 확인에는 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
